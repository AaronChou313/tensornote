[package]
name = "tensornote"
version = "1.1.0"
description = "Local-first, Markdown-first executable knowledge workspace"
authors = ["AaronChou313"]
license = "Apache-2.0"
repository = "https://github.com/AaronChou313/tensornote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tensornote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
