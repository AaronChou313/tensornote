[package]
name = "tensornote"
version = "1.4.0"
description = "Local-first, Markdown-first executable knowledge workspace"
authors = ["AaronChou313"]
license = "Apache-2.0"
repository = "https://github.com/AaronChou313/tensornote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tensornote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomic-write-file = "0.2.3"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2.5.4"
wait-timeout = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3"
