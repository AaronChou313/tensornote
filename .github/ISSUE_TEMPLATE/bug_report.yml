name: Bug report
description: Report a reproducible TensorNote problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include Jupyter tokens, extension secrets, private repository content, or exploitable security details."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 candidate / commit SHA
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Workspace source
      options:
        - Local folder
        - Built-in workspace
        - GitHub repository
        - No workspace / Home
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Local/Static/Self-hosted deployment
      placeholder: Chrome 128, macOS 15, Local Web
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and screenshots
      description: Remove tokens, secrets, private note text, and absolute personal paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a private security report.
          required: true
