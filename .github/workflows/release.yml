name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        name: Resolve and validate release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: pnpm check
      - run: pnpm test:performance
      - run: pnpm audit --prod --audit-level high
      - run: pnpm validate:release -- --tag "${{ steps.version.outputs.tag }}"
      - name: Validate bundled Workspace and templates
        run: |
          node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs .
          node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs skills/tensornote-knowledge-workspace/assets/workspace-template --strict
          node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs skills/tensornote-knowledge-workspace/assets/course-workspace-template --strict
      - name: Require official signing credentials for a tag release
        if: github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

  web:
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build version-pinned Static Web
        run: pnpm build:web
        env:
          VITE_BASE_PATH: /tensornote/
      - name: Package Static Web release asset
        shell: bash
        run: tar -czf "TensorNote-web-${{ needs.release-gate.outputs.version }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v6
        with:
          name: web-release
          path: TensorNote-web-${{ needs.release-gate.outputs.version }}.tar.gz
          if-no-files-found: error
      - uses: actions/configure-pages@v6
        if: github.ref_type == 'tag'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_type == 'tag'
        with:
          path: dist

  desktop:
    name: Desktop release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.target, 'aarch64-apple') && 'aarch64-apple-darwin' || startsWith(matrix.target, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm wget
      - run: pnpm install --frozen-lockfile
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/tensornote.p12"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/tensornote.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/tensornote.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/tensornote.keychain-db"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/tensornote.keychain-db"
          security import "$RUNNER_TEMP/tensornote.p12" -k "$RUNNER_TEMP/tensornote.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/tensornote.keychain-db"
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/tensornote.keychain-db" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)
          if [[ -z "$identity" ]]; then echo 'Developer ID Application identity not found' >&2; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'tensornote.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows signing certificate did not expose a thumbprint' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows release configuration
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'https://timestamp.digicert.com' }}
        run: node scripts/create-release-config.mjs --output .release/tauri.windows.conf.json
      - id: build-args
        name: Resolve release build arguments
        shell: bash
        run: |
          args='${{ matrix.args }} --config src-tauri/tauri.release.conf.json'
          if [[ "$RUNNER_OS" == "Windows" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            args='${{ matrix.args }} --config .release/tauri.windows.conf.json'
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: TensorNote ${{ needs.release-gate.outputs.tag }}
          releaseBody: See docs/releases/v${{ needs.release-gate.outputs.version }}.md for the release matrix, verification and rollback instructions.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: TensorNote-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: TensorNote-[version]-[platform]-[arch]-[bundle][setup][ext]
          args: ${{ steps.build-args.outputs.args }}

  container:
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build self-hosted image proof
        run: docker build --tag "tensornote:${{ needs.release-gate.outputs.version }}" .

  deploy-pages:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [release-gate, web, desktop, container]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  finalize:
    runs-on: ubuntu-latest
    needs: [release-gate, web, desktop, container]
    steps:
      - uses: actions/checkout@v7
      - name: Download Web archive for the draft Release
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v7
        with:
          name: web-release
          path: release-web
      - name: Attach Web archive to draft Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release-web/*.tar.gz --clobber
      - name: Download exact draft Release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release download "$GITHUB_REF_NAME" --dir release-assets
      - name: Download dry-run workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Generate checksums and machine-readable manifest
        run: node scripts/generate-release-manifest.mjs --assets release-assets --output release-metadata --version "${{ needs.release-gate.outputs.version }}" --tag "${{ needs.release-gate.outputs.tag }}" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error
      - name: Attach checksums and manifest to draft Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release-metadata/SHA256SUMS release-metadata/release-manifest.json --clobber
