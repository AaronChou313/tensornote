name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:performance
      - run: pnpm audit --prod --audit-level high
      - name: Validate bundled workspace
        run: node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs .
      - name: Validate workspace template
        run: node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs skills/tensornote-knowledge-workspace/assets/workspace-template --strict
      - name: Validate course workspace template
        run: node skills/tensornote-knowledge-workspace/scripts/validate-workspace.mjs skills/tensornote-knowledge-workspace/assets/course-workspace-template --strict
      - name: Validate publication candidate
        run: node scripts/validate-publication.mjs --workspace . --owner AaronChou313 --repo tensornote --revision 0123456789abcdef0123456789abcdef01234567
      - name: Validate release contracts
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          pnpm validate:release -- --tag "v${version}"
      - name: Build static deployment
        run: pnpm build:web
        env:
          VITE_BASE_PATH: /tensornote/

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:desktop
      - run: pnpm exec tauri build --no-bundle

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build -t tensornote:ci .
