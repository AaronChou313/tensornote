name: Publish TensorNote Workspace

on:
  workflow_call:
    inputs:
      runtime_ref:
        description: TensorNote source ref used to build the reader
        required: false
        type: string
        default: main
      default_note:
        description: Optional note ID overriding publishing.defaultNote
        required: false
        type: string
        default: ''
      public_url:
        description: Optional public reader base URL, including trailing slash
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tensor-note-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published Workspace
        uses: actions/checkout@v7
        with:
          path: workspace
      - name: Check out TensorNote Runtime
        uses: actions/checkout@v7
        with:
          repository: AaronChou313/tensornote
          ref: ${{ inputs.runtime_ref }}
          path: runtime
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - name: Install TensorNote Runtime
        working-directory: runtime
        run: pnpm install --frozen-lockfile
      - name: Validate public Workspace
        working-directory: runtime
        run: node scripts/validate-publication.mjs --workspace ../workspace --owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}" --revision "$GITHUB_SHA"
      - name: Build revision-pinned reader
        working-directory: runtime
        run: pnpm build:web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_TENSORNOTE_PUBLISH_OWNER: ${{ github.repository_owner }}
          VITE_TENSORNOTE_PUBLISH_REPO: ${{ github.event.repository.name }}
          VITE_TENSORNOTE_PUBLISH_REVISION: ${{ github.sha }}
          VITE_TENSORNOTE_PUBLISH_NOTE: ${{ inputs.default_note }}
          VITE_TENSORNOTE_PUBLIC_READER_URL: ${{ inputs.public_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: runtime/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
